<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta
         http-equiv="Content-Security-Policy"
         content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self';"
      />
      <link rel="stylesheet" href="../Assets/bootstrap/css/bootstrap.min.css" />
      <link rel="stylesheet" href="../Assets/style.css" />
      <title>Boris - Notes</title>
   </head>
   <body>
      <div class="container-fluid">
         <div class="row g-0">
            <div
               id="nav-div"
               class="nav-div d-flex flex-row flex-md-column col-12 col-md-2"
            ></div>
            <div id="content-div" class="content-div col-12 col-md-10">
               <h1 class="page-heading">Notes</h1>
               <div class="notesContents pageContent">
                  <div class="note_tools">
                     <form class="d-flex" role="search">
                        <input
                           class="form-control me-3 narrow-input"
                           type="search"
                           placeholder="Note title / text..."
                           aria-label="Search"
                           id="searchText"
                        />
                        <button
                           class="btn btn btn-outline-secondary"
                           id="searchBtn"
                        >
                           Search
                        </button>
                        <button
                           class="btn btn btn-outline-secondary"
                           id="addNote"
                        >
                           Add Note
                        </button>
                     </form>
                  </div>

                  <div class="noteForm narrow-top-padding">
                     <div class="collapse mt-3" id="noteFormCollapse">
                        <form>
                           <div class="card card-body">
                              <div class="mb-3">
                                 <input
                                    type="text"
                                    class="form-control"
                                    id="input_note_title"
                                    name="input_note_title"
                                    placeholder="Please enter note title..."
                                 />
                              </div>

                              <div class="mb-3">
                                 <textarea
                                    class="form-control"
                                    rows="4"
                                    name="input_note_text"
                                    id="input_note_text"
                                    placeholder="Lorem ipsum..."
                                 ></textarea>
                              </div>

                              <div class="d-flex justify-content-end gap-2">
                                 <button
                                    type="button"
                                    class="btn btn-secondary"
                                    name="cancel_note_btn"
                                    id="cancel_note_btn"
                                 >
                                    Cancel
                                 </button>

                                 <button
                                    type="submit"
                                    name="save_note_btn"
                                    id="save_notet_btn"
                                    class="btn btn-secondary"
                                 >
                                    Save
                                 </button>
                              </div>
                           </div>
                        </form>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <script src="../Assets/bootstrap/js/bootstrap.min.js"></script>
      <script type="module" src="../Scripts/renderer.js"></script>
   </body>
</html>
